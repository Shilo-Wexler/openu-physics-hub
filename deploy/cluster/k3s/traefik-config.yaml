# Our settings on top of the Traefik chart that k3s installs itself. Argo CD applies this file
# (deploy/argocd/apps/cluster-k3s.yaml), and k3s then upgrades its Traefik release with these values.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # servicelb is disabled and nothing comes in from outside: cloudflared runs in the cluster
    # and reaches Traefik through its Service.
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        forwardedHeaders:
          # The pod network, where cloudflared runs. Traefik keeps X-Forwarded-* only from there,
          # so the backends see the real visitor and https.
          trustedIPs:
            - 10.42.0.0/16
    # Every Ingress shows in its status the address it is served at. k3s copies the Service's
    # external address there, but a ClusterIP Service has none, so the status stayed empty and
    # Argo CD waited forever for the Ingresses to become healthy. Use the in-cluster name that
    # the tunnel connects to instead.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
    additionalArguments:
      - "--providers.kubernetesingress.ingressendpoint.hostname=traefik.kube-system.svc.cluster.local"