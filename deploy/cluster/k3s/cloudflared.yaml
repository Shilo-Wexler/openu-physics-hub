# The Cloudflare tunnel "openuvoice-staging", run inside the cluster. It only connects out to
# Cloudflare (no port opens on the server) and hands each request to Traefik; the hostnames and
# their target (http://traefik.kube-system.svc.cluster.local:80) are set on the tunnel in the
# Cloudflare dashboard. The token is a Secret made by hand:
#   kubectl -n cloudflared create secret generic cloudflared-token --from-literal=token=...
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # Two connectors: the tunnel stays up while one restarts or updates.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.4
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          # /ready answers 200 once the connector holds a connection to Cloudflare.
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi