# Images are built per commit and tagged with the short git hash:
#   helm upgrade --install openuvoice deploy/helm/openuvoice -n openuvoice \
#     -f deploy/helm/openuvoice/values-minikube.yaml --set-string image.tag=$(git rev-parse --short HEAD)
# --set-string, not --set: a hash made only of digits would otherwise become a number.
# registry is empty on minikube (images are built straight into the cluster);
# later it becomes e.g. "ghcr.io/shilo-wexler/".
image:
  registry: ""
  tag: ""
  pullPolicy: IfNotPresent

# One entry per backend: its database (used by the migrations Job) and its server.
# database must match the entry in the openuvoice-db chart.
# server.env holds plain settings; values that differ per environment are set in values-<env>.yaml.
# server.secretFiles maps a setting to a key of server.secretName. The Secret is mounted as files
# and the app reads <SETTING>_FILE, so secrets never appear in env vars.
backends:
  chat:
    database:
      host: chat-db
      name: chat_db
      user: chat_app
      secretName: chat-db
    server:
      enabled: true
      image: chat-backend
      replicas: 1
      port: 8000
      env:
        ENV: "prod"
        # Only the Ingress reaches the pods, so its X-Forwarded-* headers are trusted.
        FORWARDED_ALLOW_IPS: "*"
        GOOGLE_CLIENT_ID: ""
      secretName: chat-backend
      secretFiles:
        DATABASE_URL: database-url
        MOD_API_TOKEN: mod-api-token
      probes:
        live: /health/live
        ready: /health/ready
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  admin:
    database:
      host: admin-db
      name: admin_db
      user: admin_app
      secretName: admin-db
    server:
      enabled: true
      image: admin-backend
      replicas: 1
      port: 8000
      env:
        ENV: "prod"
        FORWARDED_ALLOW_IPS: "*"
        # Moderation calls go to the chat backend's Service, inside the cluster only.
        CHAT_API_URL: "http://chat-backend:8000"
        # Cloudflare Access app in front of the console; set per environment.
        CF_ACCESS_TEAM_DOMAIN: ""
        CF_ACCESS_AUD: ""
      secretName: admin-backend
      secretFiles:
        DATABASE_URL: database-url
        MOD_API_TOKEN: mod-api-token
        TURNSTILE_SECRET: turnstile-secret
      probes:
        live: /health/live
        ready: /health/ready
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          # Pillow converts announcement images to WebP in memory, so more room than chat.
          memory: 384Mi

migrate:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Daily job that deletes chat accounts whose week of grace has passed.
purge:
  schedule: "0 3 * * *"
  timeZone: Asia/Jerusalem

# The two static sites (nginx serving the built files). Each gets <name>-frontend.
frontends:
  public:
    image: public-frontend
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  admin:
    image: admin-frontend
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# One host for the site and one for the console; set per environment.
# The Ingress controller is Traefik everywhere (k3s ships it; minikube installs the same version).
# Body size limits and the inquiries rate limit are Traefik Middlewares, in templates/middlewares.yaml.
ingress:
  className: traefik
  hosts:
    public: ""
    admin: ""
    