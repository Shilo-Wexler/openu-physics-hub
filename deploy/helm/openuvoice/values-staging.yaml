# Values for staging on the Oracle server (k3s), layered on top of values.yaml.
# ArgoCD (deploy/argocd/apps/staging-app.yaml) adds tag-staging.yaml last, which CI writes
# after every merge to main. Prod gets its own values-prod.yaml that differs only in names and
# keys: same images, same settings.
# No secrets: those live in Secrets made by hand in the openuvoice-staging namespace.

# Private images built by CI. The ghcr Secret holds a read-only (read:packages) token.
image:
  registry: "ghcr.io/shilo-wexler/"
  pullSecret: ghcr

backends:
  chat:
    server:
      env:
        # The "chat staging" OAuth client. Not a secret. Its Google settings list
        # https://staging.openuvoice.com as an origin and redirect target.
        GOOGLE_CLIENT_ID: "706995094901-9vgppljvu796m2p2e4qfip0g0m31h4e1.apps.googleusercontent.com"
  admin:
    server:
      env:
        # The "admin-staging" Access application, which covers admin-staging only.
        # Identifiers, not secrets.
        CF_ACCESS_TEAM_DOMAIN: "dark-frog-20e8.cloudflareaccess.com"
        CF_ACCESS_AUD: "4ddbc61097a1941fe5fce0716c615e60d739342848bafdff265a83ff5c0a69ea"
        # Console staff sync: the "staging-console-staff" rule group, which the admin-staging
        # application allows. Identifiers, not secrets; the token is cf-api-token below.
        CF_ACCOUNT_ID: "7c5bf39729c48a468136124cae03c6b5"
        CF_ACCESS_GROUP_ID: "2acb0290-a159-4e71-9440-8d7c04a40100"
        # Site visits: the openuvoice.com zone (an identifier, not a secret; the token is
        # cf-analytics-token below). Staging counts the real site, not staging.openuvoice.com:
        # staging's own traffic is only testers, and real numbers are what a test should show.
        CF_ZONE_ID: "541fd689484158ef8e395e9204774a3a"
        VISITS_HOSTS: "openuvoice.com,www.openuvoice.com"
      # Added to the secretFiles of values.yaml. The cf-api-token may edit Access groups of this
      # account only, and only from the server's public IP address. The cf-analytics-token
      # (openuvoice-analytics-read) may only read analytics of the openuvoice.com zone.
      secretFiles:
        CF_API_TOKEN: cf-api-token
        CF_ANALYTICS_TOKEN: cf-analytics-token

# Every 15 minutes, fixes the group if a sync after a console change failed.
accessSync:
  enabled: true

# Every hour, copies the site's visits from Cloudflare for the console's stats.
visitsSync:
  enabled: true

frontends:
  public:
    env:
      # Same client as the chat backend above.
      GOOGLE_CLIENT_ID: "706995094901-9vgppljvu796m2p2e4qfip0g0m31h4e1.apps.googleusercontent.com"
      # The "openuvoice-staging" Turnstile widget; its secret is in the admin-backend Secret.
      TURNSTILE_SITE_KEY: "0x4AAAAAAFrq4kFvX_yTp6LU"

# Served by the "openuvoice-staging" Cloudflare tunnel (cloudflared runs in the cluster, see
# deploy/cluster/k3s/cloudflared.yaml), which reaches Traefik inside the cluster.
# Each host sits behind its own Access application: "staging" (testers) and "admin-staging"
# (the staging-console-staff group, kept equal to the admins table).
ingress:
  hosts:
    public: staging.openuvoice.com
    admin: admin-staging.openuvoice.com
# Fill staging with demo content (deploy/demo/). Never in production.
demo:
  enabled: true
  