{{- range $name, $site := .Values.frontends }}
{{- $component := printf "%s-frontend" $name }}
{{- $ctx := dict "root" $ "component" $component }}
---
# Internal address of a site: http://<name>-frontend:<port>. Reached only through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}
  labels:
    {{- include "openuvoice.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openuvoice.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $site.port }}
      targetPort: http
{{- end }}