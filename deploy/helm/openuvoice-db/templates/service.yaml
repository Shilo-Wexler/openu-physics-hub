{{- range $db := .Values.databases }}
{{- $ctx := dict "root" $ "db" $db }}
---
# Headless: the name resolves straight to the pod. Backends connect to <name>:5432.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openuvoice-db.name" $db }}
  labels:
    {{- include "openuvoice-db.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "openuvoice-db.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}