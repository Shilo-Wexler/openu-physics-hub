# Runs once, the first time a database starts on an empty disk.
# Creates the app user and gives it the database. Values come from env vars
# that the StatefulSet sets from the database's Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-init
  labels:
    app.kubernetes.io/part-of: openuvoice
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  10-app-user.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -v app_user="$APP_USER" -v app_password="$APP_PASSWORD" -v db="$POSTGRES_DB" <<'SQL'
    CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password';
    ALTER DATABASE :"db" OWNER TO :"app_user";
    REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
    SQL