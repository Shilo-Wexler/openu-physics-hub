# Static file server for the built admin console. The Ingress routes /api/admin to
# admin-backend, so this server only serves the files from dist.
server {
    # 8080, not 80: nginx runs as a non-root user, which cannot open ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't reveal the nginx version in headers and error pages.
    server_tokens off;

    # Compress text files on the way out; images are already compressed.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under assets/, so a changed file
    # gets a new name and the browser may keep the old one for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any path that is not a real file gets index.html,
    # and react-router picks the page. no-cache, so a deploy is seen at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Target for the Kubernetes liveness and readiness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}