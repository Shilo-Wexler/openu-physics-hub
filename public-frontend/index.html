<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="only light" />
    <title>OpenUVoice</title>
    <!-- The same text as SITE_DESCRIPTION in src/shared/seo/pageText.ts (the build checks). -->
    <meta name="description" content="פורטל הסטודנטים לפיזיקה באוניברסיטה הפתוחה: ביקורות וחוות דעת על קורסים, צ'אט, ופניות לוועד הסטודנטים." />

    <!-- Site icon for the browser tab, Google results and the phone home screen (files in public/).
         Google needs a square icon of at least 48px; the .ico holds 16, 32 and 48. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link preview when the site is shared (WhatsApp, Telegram, Facebook, X). Crawlers do not run
         the app, so they only see the HTML: the build writes a copy of this file for each course and
         main page, with its own title and description (vite.config.ts); every other page shows the
         values here. The image URL must be absolute, so it points at the production domain also on
         staging. No og:url and no canonical: one fixed value here would mark every page as a copy of
         the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenUVoice" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="OpenUVoice" />
    <meta property="og:description" content="פורטל הסטודנטים לפיזיקה באוניברסיטה הפתוחה: ביקורות וחוות דעת על קורסים, צ'אט, ופניות לוועד הסטודנטים." />
    <meta property="og:image" content="https://openuvoice.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenUVoice: פורטל הסטודנטים לפיזיקה באוניברסיטה הפתוחה" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>כדי להשתמש באתר צריך להפעיל JavaScript בדפדפן.</noscript>
    <!-- Per-environment public settings (see src/shared/lib/config.ts). A classic script, so it
         runs before the app below. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
