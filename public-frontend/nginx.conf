# Static file server for the built site. The Ingress routes /api/* to the backends,
# so this server only serves the files from dist.
server {
    # 8080, not 80: nginx runs as a non-root user, which cannot open ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't reveal the nginx version in headers and error pages.
    server_tokens off;

    # Text files are compressed once, at build time (gzip -9 in the Dockerfile): nginx sends the
    # ready file.gz when the browser accepts gzip, with no work per request.
    gzip_static on;
    # Files with no .gz (config.js, written at start) are compressed on the way out.
    # Level 5: most of the gain of 9 for much less CPU. Images are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Tells caches on the way (Cloudflare) that the answer depends on Accept-Encoding.
    gzip_vary on;

    # Vite puts a content hash in every file name under assets/, so a changed file
    # gets a new name and the browser may keep the old one for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Per-environment public settings, written at container start by docker/config.sh.
    # Served from /tmp, the only writable place; it replaces the empty dev placeholder in dist.
    # no-cache, so a changed value is seen on the next load.
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any path that is not a real file (/chat, /courses/12) gets index.html,
    # and react-router picks the page. no-cache, so a deploy is seen at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Target for the Kubernetes liveness and readiness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
